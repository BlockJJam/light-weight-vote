<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라잇웨잇 일정 투표</title>
<style>
:root{
  --primary:#0066cc; --primary-focus:#0071e3; --primary-on-dark:#2997ff;
  --canvas:#ffffff; --canvas-parchment:#f5f5f7; --surface-pearl:#fafafc;
  --surface-tile-1:#272729; --surface-tile-2:#2a2a2c; --surface-black:#000000;
  --chip-translucent:rgba(210,210,215,.64);
  --ink:#1d1d1f; --on-dark:#ffffff; --body-muted:#cccccc;
  --ink-muted-80:#333333; --ink-muted-48:#7a7a7a;
  --hairline:#e0e0e0;
  --xxs:4px; --xs:8px; --sm:12px; --md:17px; --lg:24px; --xl:32px; --xxl:48px; --section:80px;
  --r-sm:8px; --r-md:11px; --r-lg:18px; --r-pill:9999px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--canvas); color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard",sans-serif;
  font-size:17px; font-weight:400; line-height:1.47; letter-spacing:-.374px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
button:active{transform:scale(.95);}
:focus-visible{outline:2px solid var(--primary-focus);outline-offset:2px;}

.global-nav{
  position:sticky;top:0;z-index:50;height:44px;background:var(--surface-black);color:var(--on-dark);
  display:flex;align-items:center;gap:20px;padding:0 var(--lg);
  font-size:12px;letter-spacing:-.12px;line-height:1;
}
.global-nav .mark{font-weight:600;}
.global-nav .spacer{flex:1;}
.global-nav a{color:var(--on-dark);text-decoration:none;opacity:.86;}

.sub-nav{
  position:sticky;top:44px;z-index:40;height:52px;
  display:flex;align-items:center;gap:var(--md);padding:0 var(--lg);
  background:rgba(245,245,247,.8);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(0,0,0,.08);
}
.sub-nav .cat{font-size:21px;font-weight:600;letter-spacing:.231px;line-height:1.19;}
.sub-nav .spacer{flex:1;}
.sync{
  display:flex;align-items:center;gap:var(--xs);
  font-size:12px;letter-spacing:-.12px;color:var(--ink-muted-48);
  border:1px solid var(--hairline);border-radius:var(--r-pill);
  padding:5px 12px;background:var(--surface-pearl);white-space:nowrap;
}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-muted-48);flex:0 0 7px;}
.sync[data-tone="ok"] .dot{background:var(--primary);}
.sync[data-tone="busy"] .dot{background:var(--primary-focus);animation:pulse 1s ease-in-out infinite;}
.sync[data-tone="warn"] .dot{background:var(--ink);}
@keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}

.tile{padding:var(--section) var(--lg);}
.tile-parchment{background:var(--canvas-parchment);}
.tile-light{background:var(--canvas);}
.tile-dark{background:var(--surface-tile-1);color:var(--on-dark);}
.wrap{max-width:980px;margin:0 auto;}
.wrap-wide{max-width:1440px;margin:0 auto;}
.center{text-align:center;}

h1.hero{font-size:56px;font-weight:600;line-height:1.07;letter-spacing:-.28px;margin:0 0 var(--md);text-wrap:balance;}
h2.display{font-size:40px;font-weight:600;line-height:1.10;margin:0 0 var(--sm);text-wrap:balance;}
.lead{font-size:28px;line-height:1.14;letter-spacing:.196px;margin:0;color:var(--ink-muted-80);}
.tagline{font-size:21px;font-weight:600;line-height:1.19;letter-spacing:.231px;margin:0 0 var(--lg);}
.caption{font-size:14px;letter-spacing:-.224px;color:var(--ink-muted-48);}

.setup-note{
  max-width:980px;margin:0 auto var(--lg);background:var(--canvas);border:1px solid var(--hairline);
  border-radius:var(--r-lg);padding:var(--md) var(--lg);text-align:left;
  font-size:14px;letter-spacing:-.224px;color:var(--ink-muted-80);
}
.setup-note code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--ink);}

.btn-primary{background:var(--primary);color:#fff;font-size:17px;border-radius:var(--r-pill);padding:11px 22px;line-height:1.2;}
.btn-ghost-pill{background:transparent;color:var(--primary);border:1px solid var(--primary);font-size:17px;border-radius:var(--r-pill);padding:11px 22px;line-height:1.2;}
.btn-row{display:flex;gap:var(--sm);justify-content:center;flex-wrap:wrap;margin-top:var(--xl);}
.btn-primary[aria-pressed="true"],.btn-ghost-pill[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--primary-focus);}

.picker{margin-top:var(--xxl);background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:var(--lg);transition:opacity .25s ease;}
.picker.is-inactive{opacity:.32;pointer-events:none;}
.year-row{display:flex;align-items:center;justify-content:center;gap:var(--lg);margin-bottom:var(--lg);}
.year-val{font-size:34px;font-weight:600;letter-spacing:-.374px;min-width:140px;text-align:center;font-variant-numeric:tabular-nums;}
.icon-circ{width:44px;height:44px;border-radius:50%;background:var(--chip-translucent);color:var(--ink);font-size:17px;display:flex;align-items:center;justify-content:center;}
.month-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--sm);}
.month-chip{background:var(--canvas);color:var(--ink);font-size:14px;letter-spacing:-.224px;border:1px solid var(--hairline);border-radius:var(--r-pill);padding:12px 16px;text-align:center;}
.month-chip.selected{border:2px solid var(--primary-focus);color:var(--primary);font-weight:600;}
.picker-hint{margin-top:var(--lg);text-align:center;}

/* 표 스크롤 박스. 세로도 이 안에서 스크롤되므로 날짜행(thead)과 이름열이 함께 고정됩니다.
   높이는 화면에서 상단 내비(44+52px)와 여백을 뺀 값. */
.table-hint{margin-top:var(--xl);display:flex;gap:var(--md);flex-wrap:wrap;justify-content:center;}
.table-hint kbd{font-family:inherit;font-size:12px;border:1px solid var(--hairline);border-radius:6px;padding:1px 6px;background:var(--surface-pearl);color:var(--ink);}
.table-scroll{margin-top:var(--sm);overflow:auto;max-height:calc(100vh - 96px - var(--lg));border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--canvas);}
.table-scroll.is-dragging{user-select:none;-webkit-user-select:none;cursor:crosshair;}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;}
th,td{border-bottom:1px solid var(--hairline);white-space:nowrap;}
thead th{position:sticky;top:0;z-index:3;background:var(--canvas-parchment);font-size:14px;font-weight:600;letter-spacing:-.224px;color:var(--ink);padding:var(--sm) var(--md);text-align:center;font-variant-numeric:tabular-nums;}
th.name-col,td.name-col{position:sticky;left:0;z-index:2;background:var(--canvas);text-align:left;padding:var(--xs) var(--md);min-width:190px;border-right:1px solid var(--hairline);}
thead th.name-col{z-index:4;background:var(--canvas-parchment);}
td.name-col{font-size:17px;letter-spacing:-.374px;}
.name-cell{display:flex;align-items:center;gap:var(--xs);justify-content:space-between;}
.del-btn{width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;color:var(--ink-muted-48);border:1px solid var(--hairline);border-radius:50%;background:var(--surface-pearl);}
.del-btn:active{transform:scale(.9);}
td.vote-cell{padding:var(--xxs) var(--xs);text-align:center;}
/* 투표 셀 버튼. 클릭마다 – → O → X → – 순환, 마우스 드래그로 같은 값 채우기 */
button.vote{background:var(--canvas);color:var(--ink-muted-48);border:1px solid var(--hairline);border-radius:var(--r-pill);font-family:inherit;font-size:14px;letter-spacing:-.224px;padding:6px 14px;min-width:60px;line-height:1.3;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:box-shadow .5s ease;}
button.vote.is-o{border:2px solid var(--primary-focus);color:var(--primary);font-weight:600;padding:5px 13px;}
button.vote.is-x{border:1px solid var(--hairline);color:var(--ink);font-weight:600;background:var(--canvas-parchment);}
button.vote.just-changed{box-shadow:0 0 0 4px rgba(41,151,255,.28);}
button.vote.is-preview{box-shadow:0 0 0 3px rgba(41,151,255,.45);transition:none;}
button.vote.is-origin{box-shadow:0 0 0 3px var(--primary-focus);transition:none;}
.is-dragging button.vote,.is-dragging button.vote:active{transform:none;}
.add-btn{font-size:14px;letter-spacing:-.224px;color:var(--primary);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:6px 16px;background:var(--surface-pearl);}
.add-form{display:flex;gap:var(--xs);align-items:center;}
input.name-input{font-family:inherit;font-size:17px;letter-spacing:-.374px;color:var(--ink);background:var(--canvas);border:1px solid rgba(0,0,0,.08);border-radius:var(--r-pill);padding:8px 16px;height:40px;width:130px;}
input.name-input:focus{outline:2px solid var(--primary-focus);}
.mini-primary{background:var(--primary);color:#fff;font-size:14px;letter-spacing:-.224px;border-radius:var(--r-pill);padding:8px 14px;}
.mini-ghost{background:transparent;color:var(--ink-muted-48);font-size:14px;border-radius:var(--r-pill);padding:8px 10px;}

.result-hero{font-size:56px;font-weight:600;line-height:1.07;letter-spacing:-.28px;margin:var(--lg) 0 var(--xs);text-wrap:balance;}
.result-sub{font-size:21px;font-weight:600;letter-spacing:.231px;color:var(--body-muted);margin:0;}
.rank-list{margin:var(--xxl) auto 0;max-width:620px;display:flex;flex-direction:column;gap:var(--sm);}
.rank-item{display:flex;align-items:center;gap:var(--md);position:relative;transition:transform .35s ease,opacity .35s ease;}
.rank-label{width:110px;font-size:14px;letter-spacing:-.224px;color:var(--body-muted);text-align:right;font-variant-numeric:tabular-nums;}
.rank-bar-track{display:block;flex:1;height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.12);overflow:hidden;}
.rank-bar{display:block;height:100%;min-width:2px;border-radius:var(--r-pill);background:var(--primary-on-dark);transition:width .4s ease;}
.rank-count{width:64px;font-size:14px;letter-spacing:-.224px;text-align:left;color:var(--on-dark);font-variant-numeric:tabular-nums;}
.rank-item.is-rest{opacity:.55;}
.rank-item.is-top{
  background:var(--surface-tile-2);border:1px solid rgba(41,151,255,.28);border-radius:var(--r-lg);
  padding:var(--md) var(--lg);margin:var(--xs) 0;transform:scale(1.06);
}
.rank-item.is-top::before{
  content:'';position:absolute;inset:-6px;z-index:-1;border-radius:calc(var(--r-lg) + 6px);
  background:rgba(41,151,255,.22);filter:blur(26px);animation:halo 3.2s ease-in-out infinite;
}
@keyframes halo{0%,100%{opacity:.55;}50%{opacity:1;}}
.rank-item.is-top .rank-label{width:auto;min-width:150px;display:flex;align-items:center;justify-content:flex-end;gap:var(--xs);font-size:21px;font-weight:600;letter-spacing:.231px;color:var(--on-dark);}
.rank-item.is-top .rank-bar-track{height:12px;background:rgba(255,255,255,.16);}
.rank-item.is-top .rank-count{width:82px;font-size:21px;font-weight:600;letter-spacing:.231px;color:var(--primary-on-dark);}
.rank-badge{font-size:12px;font-weight:600;letter-spacing:-.12px;line-height:1;color:var(--primary-on-dark);background:rgba(41,151,255,.16);border-radius:var(--r-pill);padding:5px 10px;}

footer{background:var(--canvas-parchment);color:var(--ink-muted-80);padding:64px var(--lg);}
footer .fine{font-size:12px;letter-spacing:-.12px;color:var(--ink-muted-48);margin:0;}
.empty-state{padding:var(--xxl) 0;text-align:center;}

@media (prefers-reduced-motion:reduce){
  .rank-item.is-top::before{animation:none;}
  .sync[data-tone="busy"] .dot{animation:none;}
  *{transition:none !important;}
}
@media (max-width:1068px){ h1.hero,.result-hero{font-size:40px;} }
@media (max-width:833px){ .tile{padding:var(--xxl) var(--md);} .month-grid{grid-template-columns:repeat(4,1fr);} }
@media (max-width:640px){
  h1.hero,.result-hero{font-size:34px;} h2.display{font-size:28px;} .lead{font-size:21px;}
  .sync span.label{display:none;}
  th.name-col,td.name-col{min-width:150px;}
  .rank-item.is-top{transform:none;padding:var(--sm) var(--md);}
  .rank-item.is-top .rank-label{min-width:0;font-size:17px;}
  .rank-item.is-top .rank-count{width:64px;font-size:17px;}
}
@media (max-width:419px){ h1.hero,.result-hero{font-size:28px;} .month-grid{grid-template-columns:repeat(3,1fr);} }
</style>
</head>
<body>

<nav class="global-nav">
  <span class="mark">라잇웨잇</span>
  <a href="#pick">일정</a><a href="#vote">투표</a><a href="#result">결과</a>
  <span class="spacer"></span><a href="#result">Results</a>
</nav>

<div class="sub-nav">
  <span class="cat">일정 투표</span>
  <span class="spacer"></span>
  <span class="sync" id="sync" data-tone="idle"><span class="dot"></span><span class="label" id="syncLabel">연결 중</span></span>
</div>

<section class="tile tile-parchment" id="pick">
  <div class="wrap center">
    <h1 class="hero">언제 모일까요.</h1>
    <p class="lead">연도와 달을 고르면, 평일만 추린 투표표가 열립니다.</p>

    <div class="setup-note" id="setupNote" hidden></div>

    <div class="btn-row">
      <button class="btn-primary" id="btnActivate" aria-pressed="false">Activate</button>
      <button class="btn-ghost-pill" id="btnInactive" aria-pressed="true">Inactive</button>
    </div>

    <div class="picker is-inactive" id="picker" aria-disabled="true">
      <div class="year-row">
        <button class="icon-circ" id="yearPrev" aria-label="이전 연도">&#8249;</button>
        <span class="year-val" id="yearVal">—</span>
        <button class="icon-circ" id="yearNext" aria-label="다음 연도">&#8250;</button>
      </div>
      <div class="month-grid" id="monthGrid"></div>
      <p class="picker-hint caption" id="pickerHint"></p>
    </div>
  </div>
</section>

<section class="tile tile-light" id="vote">
  <div class="wrap-wide">
    <div class="center">
      <h2 class="display" id="tableTitle">투표표</h2>
      <p class="lead" id="tableSub">주말과 공휴일을 제외한 평일에 O / X 를 선택하세요.</p>
    </div>
    <div id="tableArea"></div>
  </div>
</section>

<section class="tile tile-dark center" id="result">
  <div class="wrap">
    <p class="tagline" style="color:var(--primary-on-dark);">종합 결과</p>
    <h2 class="result-hero" id="bestDay">—</h2>
    <p class="result-sub" id="bestMeta">아직 투표가 없습니다.</p>
    <div class="rank-list" id="rankList"></div>
  </div>
</section>

<footer>
  <div class="wrap"><p class="fine" id="footNote">라잇웨잇 동호회 일정 투표</p></div>
</footer>

<script src="./holidays.js"></script>
<script type="module">
/* ============================================================
   ① 여기 두 줄만 본인 프로젝트 값으로 바꾸세요.
      Supabase 대시보드 → Settings → API 에서 복사합니다.
   ============================================================ */
const SUPABASE_URL = 'https://qjtoktofqbyhepezhdcb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-ZBSv9BOrilczEtV9Ai_Uw_BuqCb0hS';

/* 값을 안 넣으면 이 브라우저 안에서만 도는 로컬 모드로 실행됩니다. */
const CONFIGURED = SUPABASE_URL.startsWith('http') && SUPABASE_KEY.length > 20;

const DEFAULT_MEMBERS = ['조윤호','주재민','강현수','민대인','봉원훈','송지성','신규진','신혜빈',
  '유성호','이정주','이창윤','조용문','허석원','김은정','최광래','이지은',
  '이세민','이한슬','박예리','김재형','이희연','이경희','정우진','김지현',
  '이성호','강동우','이건희','오진우'];

const DOW = ['일','월','화','수','목','금','토'];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* 화면 상태 — 항상 서버가 진실이고, 이건 그 사본입니다. */
const S = {
  year: new Date().getFullYear(),
  month: null,
  active: false,
  members: [],            // [{name, sort_order}]
  votes: {}               // { 이름: { 일: 'O'|'X' } }  ← 현재 보고 있는 달만
};

let sb = null;

/* ---------- 상태 칩 ---------- */
function setSync(tone, label){
  $('sync').setAttribute('data-tone', tone);
  $('syncLabel').textContent = label;
}
let errTimer = null;
function flashError(msg){
  setSync('warn', msg);
  clearTimeout(errTimer);
  errTimer = setTimeout(() => setSync(sb ? 'ok' : 'warn', sb ? '연결됨' : '로컬 모드'), 4000);
}

/* ============================================================
   Supabase 연결
   ============================================================ */
async function connect(){
  if(!CONFIGURED){
    setSync('warn', '로컬 모드');
    $('setupNote').hidden = false;
    $('setupNote').innerHTML =
      '<strong>아직 Supabase에 연결되지 않았습니다.</strong> 지금은 이 브라우저 안에서만 동작하고, ' +
      '새로고침하면 초기화됩니다. 파일을 열어 <code>SUPABASE_URL</code> 과 <code>SUPABASE_KEY</code> ' +
      '두 줄을 본인 프로젝트 값으로 바꾸면 실시간 공유가 켜집니다.';
    $('footNote').textContent = '라잇웨잇 동호회 일정 투표 · 로컬 모드 (저장되지 않음)';
    S.members = DEFAULT_MEMBERS.map((name, i) => ({ name, sort_order: i + 1 }));
    return;
  }

  try {
    // CDN이 막혀 있거나 느릴 때 페이지가 멈추지 않도록 10초 제한
    const mod = await Promise.race([
      import('https://esm.sh/@supabase/supabase-js@2'),
      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 10000))
    ]);
    sb = mod.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch (e) {
    sb = null;
    setSync('warn', '연결 실패 · 로컬 모드');
    S.members = DEFAULT_MEMBERS.map((name, i) => ({ name, sort_order: i + 1 }));
    return;
  }

  await loadBoard();
  await loadMembers();
  await loadVotes();
  subscribe();
  setSync('ok', '연결됨');
  $('footNote').textContent = '라잇웨잇 동호회 일정 투표 · 입력하는 즉시 저장되고 모두의 화면에 반영됩니다.';
}

const monthKey = () => S.month ? S.year + '-' + String(S.month).padStart(2,'0') : null;

async function loadBoard(){
  const { data, error } = await sb.from('board').select('*').eq('id', 1).maybeSingle();
  if(error){ flashError('설정을 읽지 못했습니다'); return; }
  if(data){ S.year = data.year || S.year; S.month = data.month; S.active = !!data.active; }
}

async function loadMembers(){
  const { data, error } = await sb.from('members').select('name, sort_order').order('sort_order');
  if(error){ flashError('명단을 읽지 못했습니다'); return; }
  S.members = data || [];
}

async function loadVotes(){
  S.votes = {};
  const key = monthKey();
  if(!key) return;
  const { data, error } = await sb.from('votes').select('member, day, value').eq('month', key);
  if(error){ flashError('투표를 읽지 못했습니다'); return; }
  (data || []).forEach(r => {
    if(!S.votes[r.member]) S.votes[r.member] = {};
    S.votes[r.member][r.day] = r.value;
  });
}

/* ============================================================
   쓰기 — 바뀐 셀 하나만 보냅니다 (서로 덮어쓰지 않도록)
   ============================================================ */
async function writeVote(member, day, value){
  if(!sb) return;
  setSync('busy', '저장 중');
  const key = monthKey();
  const q = value
    ? sb.from('votes').upsert({ month:key, member, day, value, updated_at:new Date().toISOString() })
    : sb.from('votes').delete().match({ month:key, member, day });
  const { error } = await q;
  if(error) flashError('저장 실패 · 다시 시도하세요');
  else setSync('ok', '저장됨');
}

/* 드래그 채우기 결과를 한 번에 저장. changes = [{member, day, value}] */
async function writeVotesBulk(changes){
  if(!sb || !changes.length) return;
  setSync('busy', '저장 중');
  const key = monthKey(), now = new Date().toISOString();
  let failed = false;

  const ups = changes.filter(c => c.value)
    .map(c => ({ month:key, member:c.member, day:c.day, value:c.value, updated_at:now }));
  if(ups.length){
    const { error } = await sb.from('votes').upsert(ups);
    if(error) failed = true;
  }

  const dels = changes.filter(c => !c.value);
  if(dels.length){
    const members = [...new Set(dels.map(d => d.member))];
    const days    = [...new Set(dels.map(d => d.day))];
    if(members.length === 1 || days.length === 1){
      // 한 줄(가로 또는 세로) 범위라서 member × day 조합이 정확히 dels 와 같습니다.
      const { error } = await sb.from('votes').delete().eq('month', key).in('member', members).in('day', days);
      if(error) failed = true;
    } else {
      const rs = await Promise.all(dels.map(d => sb.from('votes').delete().match({ month:key, member:d.member, day:d.day })));
      if(rs.some(r => r.error)) failed = true;
    }
  }
  if(failed) flashError('일부 저장 실패 · 다시 시도하세요');
  else setSync('ok', '저장됨');
}

async function writeBoard(){
  if(!sb) return;
  setSync('busy', '저장 중');
  const { error } = await sb.from('board')
    .upsert({ id:1, year:S.year, month:S.month, active:S.active });
  if(error) flashError('저장 실패 · 다시 시도하세요');
  else setSync('ok', '저장됨');
}

async function writeAddMember(name){
  if(!sb) return;
  const next = S.members.reduce((m, x) => Math.max(m, x.sort_order || 0), 0) + 1;
  const { error } = await sb.from('members').insert({ name, sort_order: next });
  if(error) flashError(error.code === '23505' ? '이미 있는 이름입니다' : '추가 실패');
}

async function writeDeleteMember(name){
  if(!sb) return;
  await sb.from('votes').delete().eq('member', name);
  const { error } = await sb.from('members').delete().eq('name', name);
  if(error) flashError('삭제 실패');
}

/* ============================================================
   실시간 수신 — 남이 바꾼 것만 그 자리에 반영
   ============================================================ */
function subscribe(){
  sb.channel('vote-board')
    .on('postgres_changes', { event:'*', schema:'public', table:'votes' }, (p) => {
      const row = p.new && p.new.month ? p.new : p.old;
      if(!row || row.month !== monthKey()) return;          // 다른 달이면 무시
      if(p.eventType === 'DELETE'){
        if(S.votes[row.member]) delete S.votes[row.member][row.day];
      } else {
        if(!S.votes[row.member]) S.votes[row.member] = {};
        S.votes[row.member][row.day] = row.value;
      }
      patchCell(row.member, row.day, p.eventType === 'DELETE' ? '' : row.value);
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'members' }, async () => {
      await loadMembers();
      await loadVotes();
      renderTable();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'board' }, async (p) => {
      const b = p.new;
      if(!b) return;
      const monthChanged = b.year !== S.year || b.month !== S.month;
      S.year = b.year; S.month = b.month; S.active = !!b.active;
      if(monthChanged) await loadVotes();
      renderAll();
    })
    .subscribe((status) => {
      if(status === 'SUBSCRIBED') setSync('ok', '연결됨');
      if(status === 'CHANNEL_ERROR') flashError('실시간 연결 끊김');
    });
}

/* 셀 하나만 갱신 — 표 전체를 다시 그리지 않아 입력 중 화면이 튀지 않습니다. */
function patchCell(member, day, value){
  const btn = document.querySelector(
    'button.vote[data-name="' + (window.CSS && CSS.escape ? CSS.escape(member) : member) + '"][data-day="' + day + '"]'
  );
  if(btn){
    paintCell(btn, value);
    btn.classList.add('just-changed');
    setTimeout(() => btn.classList.remove('just-changed'), 900);
  }
  renderResult(weekdaysOf(S.year, S.month));
}

function renderPicker(){
  $('btnActivate').setAttribute('aria-pressed', String(S.active));
  $('btnInactive').setAttribute('aria-pressed', String(!S.active));
  $('picker').classList.toggle('is-inactive', !S.active);
  $('picker').setAttribute('aria-disabled', String(!S.active));
  $('pickerHint').textContent = S.active
    ? '달을 선택하면 아래에 표가 만들어집니다. 선택한 달은 모두에게 똑같이 보입니다.'
    : '캘린더가 비활성 상태입니다. Activate를 누르세요.';
  $('yearVal').textContent = S.year + '년';

  const g = $('monthGrid');
  g.innerHTML = '';
  for(let m = 1; m <= 12; m++){
    const b = document.createElement('button');
    b.className = 'month-chip' + (S.month === m ? ' selected' : '');
    b.textContent = m + '월';
    b.onclick = async () => {
      S.month = m;
      renderPicker();
      if(sb) await loadVotes();
      renderTable();
      writeBoard();
    };
    g.appendChild(b);
  }
}

// holidays.js 가 제공하는 공휴일 맵. 파일이 없거나 해당 연도가 없으면 빈 객체.
function holidaysOf(year){
  const all = (typeof window !== 'undefined' && window.HOLIDAYS) || {};
  return all[String(year)] || {};
}
function holidayName(year, month, day){
  const key = String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
  return holidaysOf(year)[key] || null;
}

// 주말과 공휴일을 제외한 평일 목록. 제외된 평일 공휴일은 skipped 에 담아 안내에 쓴다.
function weekdaysOf(year, month){
  const out = [];
  out.skipped = [];
  if(!month) return out;
  const last = new Date(year, month, 0).getDate();
  for(let d = 1; d <= last; d++){
    const w = new Date(year, month - 1, d).getDay();
    if(w === 0 || w === 6) continue;
    const h = holidayName(year, month, d);
    if(h){ out.skipped.push({ day:d, name:h }); continue; }
    out.push({ day:d, label:d + '일(' + DOW[w] + ')' });
  }
  return out;
}

function renderTable(){
  const area = $('tableArea');
  if(!S.active || !S.month){
    area.innerHTML = '<div class="empty-state caption">먼저 <strong>Activate</strong> 후 연도와 달을 선택하세요.</div>';
    $('tableTitle').textContent = '투표표';
    $('tableSub').textContent = '주말과 공휴일을 제외한 평일에 O / X 를 선택하세요.';
    renderResult([]);
    return;
  }

  const days = weekdaysOf(S.year, S.month);
  $('tableTitle').textContent = S.year + '년 ' + S.month + '월';
  let sub = '평일 ' + days.length + '일 · 인원 ' + S.members.length + '명';
  if(days.skipped.length){
    sub += ' · 공휴일 제외: ' + days.skipped.map(h => h.day + '일 ' + h.name).join(', ');
  }
  $('tableSub').textContent = sub;

  let html = '<div class="table-hint caption">' +
    '<span><kbd>클릭</kbd> – &rarr; O &rarr; X &rarr; – 순환</span>' +
    '<span><kbd>드래그</kbd> 셀을 누른 채 가로·세로로 끌면 같은 값으로 채움</span></div>';
  html += '<div class="table-scroll" id="tableScroll"><table><thead><tr><th class="name-col">이름</th>';
  days.forEach(d => { html += '<th>' + d.label + '</th>'; });
  html += '</tr></thead><tbody>';

  S.members.forEach(({ name }, r) => {
    html += '<tr><td class="name-col"><div class="name-cell"><span>' + esc(name) + '</span>' +
            '<button class="del-btn" data-del="' + esc(name) + '" aria-label="' + esc(name) + ' 삭제">&#215;</button></div></td>';
    days.forEach((d, c) => {
      const v = (S.votes[name] && S.votes[name][d.day]) || '';
      html += '<td class="vote-cell"><button type="button" class="vote' + voteCls(v) + '"' +
              ' data-name="' + esc(name) + '" data-day="' + d.day + '" data-r="' + r + '" data-c="' + c + '"' +
              ' aria-label="' + esc(name) + ' ' + d.label + '">' + voteText(v) + '</button></td>';
    });
    html += '</tr>';
  });

  html += '<tr class="add-row"><td class="name-col"><div id="addSlot">' +
          '<button class="add-btn" id="addBtn">[+] 인원 추가</button></div></td>' +
          '<td class="vote-cell" colspan="' + days.length + '"></td></tr></tbody></table></div>';
  area.innerHTML = html;

  area.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const name = btn.dataset.del;
      S.members = S.members.filter(m => m.name !== name);
      delete S.votes[name];
      renderTable();
      await writeDeleteMember(name);
    });
  });

  $('addBtn').addEventListener('click', openAddForm);
  renderResult(days);
}

/* ============================================================
   셀 조작 — 클릭 순환과 드래그 채우기
   표는 renderTable 마다 다시 그려지므로 리스너는 tableArea 에 한 번만 붙입니다.
   ============================================================ */
const NEXT_VALUE = { '':'O', 'O':'X', 'X':'' };
const voteCls  = (v) => v === 'O' ? ' is-o' : (v === 'X' ? ' is-x' : '');
const voteText = (v) => v || '–';
const cellValue = (btn) => (S.votes[btn.dataset.name] && S.votes[btn.dataset.name][Number(btn.dataset.day)]) || '';

function paintCell(btn, value){
  btn.className = 'vote' + voteCls(value);
  btn.textContent = voteText(value);
}

/* 상태 반영 + 화면 반영. DB 저장은 호출한 쪽에서 결정합니다. 바뀌었으면 true. */
function setVote(btn, value){
  const n = btn.dataset.name, d = Number(btn.dataset.day);
  if(cellValue(btn) === value) return false;
  if(!S.votes[n]) S.votes[n] = {};
  if(value) S.votes[n][d] = value; else delete S.votes[n][d];
  paintCell(btn, value);
  return true;
}

const drag = {
  active:false, moved:false, justDragged:false,
  origin:null, axis:null, value:'', x0:0, y0:0,
  targets:new Map()          // key 'r:c' → button (미리보기 중인 셀)
};
const DRAG_THRESHOLD = 8;    // px. 이보다 작게 움직이면 클릭으로 취급

function cellAt(r, c){
  return $('tableArea').querySelector('button.vote[data-r="' + r + '"][data-c="' + c + '"]');
}

function clearPreview(){
  drag.targets.forEach(btn => { paintCell(btn, cellValue(btn)); btn.classList.remove('is-preview'); });
  drag.targets.clear();
  if(drag.origin) drag.origin.classList.remove('is-origin');
}

function updatePreview(r1, c1){
  const r0 = Number(drag.origin.dataset.r), c0 = Number(drag.origin.dataset.c);
  const want = new Map();
  if(drag.axis === 'h'){
    for(let c = Math.min(c0, c1); c <= Math.max(c0, c1); c++){ const b = cellAt(r0, c); if(b) want.set(r0 + ':' + c, b); }
  } else {
    for(let r = Math.min(r0, r1); r <= Math.max(r0, r1); r++){ const b = cellAt(r, c0); if(b) want.set(r + ':' + c0, b); }
  }
  drag.targets.forEach((btn, k) => {
    if(!want.has(k)){ paintCell(btn, cellValue(btn)); btn.classList.remove('is-preview'); }
  });
  want.forEach((btn, k) => {
    if(!drag.targets.has(k)){ paintCell(btn, drag.value); btn.classList.add('is-preview'); }
  });
  drag.targets = want;
  drag.origin.classList.add('is-origin');
}

function endDrag(commit){
  const scroll = $('tableScroll');
  if(scroll) scroll.classList.remove('is-dragging');
  if(!drag.active) return;
  drag.active = false;
  if(drag.moved){
    drag.justDragged = true;          // 곧 따라오는 click 이벤트는 무시
    const changes = [];
    if(commit){
      drag.targets.forEach(btn => {
        if(setVote(btn, drag.value)) changes.push({ member:btn.dataset.name, day:Number(btn.dataset.day), value:drag.value });
      });
    }
    clearPreview();
    if(changes.length){
      renderResult(weekdaysOf(S.year, S.month));
      writeVotesBulk(changes);
    }
  }
  drag.origin = null; drag.axis = null; drag.moved = false;
}

function initCellInteractions(){
  const area = $('tableArea');

  // 클릭: – → O → X → – (현재 값 기준이라 다른 사람이 바꾼 값 위에서도 자연스럽게 이어집니다)
  area.addEventListener('click', (e) => {
    const btn = e.target.closest('button.vote');
    if(!btn) return;
    if(drag.justDragged){ drag.justDragged = false; return; }
    const v = NEXT_VALUE[cellValue(btn)];
    setVote(btn, v);
    renderResult(weekdaysOf(S.year, S.month));
    writeVote(btn.dataset.name, Number(btn.dataset.day), v);
  });

  // 드래그 시작 (마우스·펜만. 터치는 표 스크롤과 충돌하므로 탭 순환만 지원)
  area.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('button.vote');
    if(!btn || e.button !== 0 || e.pointerType === 'touch') return;
    drag.active = true; drag.moved = false; drag.justDragged = false;
    drag.origin = btn; drag.axis = null; drag.value = cellValue(btn);
    drag.x0 = e.clientX; drag.y0 = e.clientY;
    e.preventDefault();               // 텍스트 선택 방지
  });

  document.addEventListener('pointermove', (e) => {
    if(!drag.active) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if(!drag.axis){
      if(Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
      drag.axis = Math.abs(dx) >= Math.abs(dy) ? 'h' : 'v';   // 첫 이동 각도로 방향 결정 후 고정
      drag.moved = true;
      const scroll = $('tableScroll'); if(scroll) scroll.classList.add('is-dragging');
    }
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const over = el && el.closest ? el.closest('button.vote, td.vote-cell') : null;
    if(!over) return;                 // 표 밖이면 마지막 범위 유지
    const btn = over.matches('button.vote') ? over : over.querySelector('button.vote');
    if(!btn) return;
    updatePreview(Number(btn.dataset.r), Number(btn.dataset.c));
  });

  document.addEventListener('pointerup', () => endDrag(true));
  document.addEventListener('pointercancel', () => endDrag(false));
  window.addEventListener('blur', () => endDrag(false));
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && drag.active) endDrag(false); });
}

function openAddForm(){
  $('addSlot').innerHTML = '<div class="add-form">' +
    '<input class="name-input" id="newName" placeholder="이름" autocomplete="off">' +
    '<button class="mini-primary" id="confirmAdd">확정</button>' +
    '<button class="mini-ghost" id="cancelAdd">취소</button></div>';
  const input = $('newName');
  input.focus();
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); commitAdd(); }
    if(e.key === 'Escape'){ renderTable(); }
  });
  $('confirmAdd').addEventListener('click', commitAdd);
  $('cancelAdd').addEventListener('click', renderTable);
}

async function commitAdd(){
  const v = ($('newName').value || '').trim();
  if(!v){ $('newName').focus(); return; }
  if(!S.members.some(m => m.name === v)){
    const next = S.members.reduce((m, x) => Math.max(m, x.sort_order || 0), 0) + 1;
    S.members.push({ name:v, sort_order:next });
  }
  renderTable();
  await writeAddMember(v);
}

function renderResult(days){
  const list = $('rankList');
  if(!days || !days.length){
    $('bestDay').textContent = '—';
    $('bestMeta').textContent = '아직 투표가 없습니다.';
    list.innerHTML = '';
    return;
  }
  const counts = days.map(d => {
    let c = 0;
    S.members.forEach(({ name }) => { if(S.votes[name] && S.votes[name][d.day] === 'O') c++; });
    return { label:d.label, count:c };
  });
  const max = Math.max(...counts.map(c => c.count));
  if(max === 0){
    $('bestDay').textContent = '—';
    $('bestMeta').textContent = 'O 표시가 아직 없습니다.';
    list.innerHTML = '';
    return;
  }
  const winners = counts.filter(c => c.count === max);
  let head = S.month + '월 ' + winners[0].label;
  if(winners.length === 2) head += ', ' + winners[1].label;
  else if(winners.length > 2) head += ' 외 ' + (winners.length - 1) + '일';
  $('bestDay').textContent = head;
  $('bestMeta').textContent = 'O ' + max + '표 · 전체 ' + S.members.length + '명 중' +
    (winners.length > 2 ? ' · 공동 1위 ' + winners.length + '일' : '');

  const top = [...counts].sort((a, b) => b.count - a.count).slice(0, 5);
  list.innerHTML = top.map(c => {
    const pct = Math.round(c.count / max * 100), isTop = c.count === max;
    return '<div class="rank-item ' + (isTop ? 'is-top' : 'is-rest') + '">' +
      '<span class="rank-label">' + (isTop ? '<span class="rank-badge">1위</span>' : '') + S.month + '월 ' + c.label + '</span>' +
      '<span class="rank-bar-track"><span class="rank-bar" style="width:' + pct + '%"></span></span>' +
      '<span class="rank-count">O ' + c.count + '</span></div>';
  }).join('');
}

function renderAll(){ renderPicker(); renderTable(); }

/* ---------- 시작 ---------- */
$('btnActivate').onclick = () => { S.active = true; renderAll(); writeBoard(); };
$('btnInactive').onclick = () => { S.active = false; S.month = null; renderAll(); writeBoard(); };
$('yearPrev').onclick = async () => { S.year--; renderPicker(); if(sb) await loadVotes(); renderTable(); writeBoard(); };
$('yearNext').onclick = async () => { S.year++; renderPicker(); if(sb) await loadVotes(); renderTable(); writeBoard(); };

initCellInteractions();
renderAll();
await connect();
renderAll();
</script>
